name: Meta Scanner - Publish NuGet

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example metascanner-1.0.26308.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for NuGet Trusted Publishing (OIDC)

jobs:
  publish:
    environment: 'Nuget Publish'
    runs-on: windows-latest
    steps:
      # Download the .nupkg from your release
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ github.event.inputs.tag_name }}
          fileName: "*.nupkg"
          out-file-path: ./nupkg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded packages
        run: Get-ChildItem -Path ./nupkg -Recurse
        shell: pwsh

      # Exchange the GitHub OIDC token for a short-lived (1 hour) nuget.org API key
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $files = Get-ChildItem -Path "./nupkg" -Filter "*.nupkg"
          foreach ($f in $files) {
            Write-Host "Publishing $($f.FullName)"
            nuget push $f.FullName -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json -SkipDuplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
